name: Qualidade

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Reavalia CVEs e cadeia de build mesmo quando o código não muda.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # Uma auditoria agendada recebe grupo próprio e nunca cancela uma publicação
  # de push/workflow_dispatch em andamento. Releases do mesmo ref continuam
  # serializados e a execução mais nova substitui a antiga.
  group: quality-${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, testes e artefato
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PAGES_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Obter o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Instalar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Confirmar a cadeia de ferramentas
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(pnpm --version)" = "11.9.0"

      - name: Instalar dependências travadas
        run: pnpm install --frozen-lockfile

      - name: Auditar vulnerabilidades conhecidas
        run: pnpm audit --audit-level=moderate

      - name: Gerar SBOM CycloneDX da aplicação
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.74.0
          format: cyclonedx
          output: sbom-academia-iat.cdx.json
          exit-code: "0"

      - name: Validar inventário, proveniência e limites de mídia
        run: pnpm check:media

      - name: Executar o portão premium
        run: pnpm audit:premium

      - name: Compilar para o GitHub Pages
        run: pnpm build

      - name: Executar a suíte de qualidade
        run: pnpm test

      - name: Executar regressões autocontidas do tooling
        run: python3 -B -m unittest tools/test_tooling.py

      - name: Auditar o catálogo offline
        run: node tools/check-offline-packages.mjs

      - name: Preparar o artefato imutável do Pages
        run: touch dist/.nojekyll

      - name: Validar o artefato publicável
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, stat } from "node:fs/promises";
          import { join } from "node:path";

          const dist = "dist";
          const repo = process.env.PAGES_REPO;
          const base = `/${repo}/`;
          const requiredNonEmpty = [
            "index.html",
            "manifest.webmanifest",
            "sw.js",
            "icone-192.png",
            "icone-512.png",
          ];

          for (const file of requiredNonEmpty) {
            const info = await stat(join(dist, file));
            if (!info.isFile() || info.size === 0) {
              throw new Error(`Artefato obrigatório vazio ou ausente: ${file}`);
            }
          }

          // O marcador oficial do GitHub Pages é, por definição, um arquivo
          // vazio. Ele precisa existir, mas exigir bytes dele tornaria o
          // próprio formato válido impossível de publicar.
          const noJekyll = await stat(join(dist, ".nojekyll"));
          if (!noJekyll.isFile()) {
            throw new Error("Marcador .nojekyll ausente do artefato");
          }

          const html = await readFile(join(dist, "index.html"), "utf8");
          const manifest = JSON.parse(
            await readFile(join(dist, "manifest.webmanifest"), "utf8"),
          );
          const serviceWorker = await readFile(join(dist, "sw.js"), "utf8");

          if (manifest.start_url !== base || manifest.scope !== base) {
            throw new Error(
              `Manifesto fora da base do Pages: esperado ${base}, ` +
              `recebido ${manifest.start_url} / ${manifest.scope}`,
            );
          }
          if (!html.includes(`src="${base}assets/`)) {
            throw new Error(`index.html não referencia o JavaScript sob ${base}`);
          }
          if (!html.includes(`href="${base}manifest.webmanifest"`)) {
            throw new Error(`index.html não referencia o manifesto sob ${base}`);
          }
          if (!serviceWorker.includes(`const BASE = ${JSON.stringify(base)}`)) {
            throw new Error(`service worker não foi gerado para ${base}`);
          }

          const scripts = [
            ...html.matchAll(/<script[^>]+src="([^"]+)"/g),
          ].map((match) => match[1]);
          if (scripts.length === 0) {
            throw new Error("index.html não contém entrada JavaScript");
          }
          for (const publicUrl of scripts) {
            if (!publicUrl.startsWith(base)) {
              throw new Error(`Entrada fora da base esperada: ${publicUrl}`);
            }
            const localPath = publicUrl.slice(base.length);
            const info = await stat(join(dist, localPath));
            if (!info.isFile() || info.size === 0) {
              throw new Error(`Entrada JavaScript inválida: ${localPath}`);
            }
          }

          const files = await readdir(join(dist, "assets"));
          if (!files.some((file) => file.endsWith(".js"))) {
            throw new Error("dist/assets não contém JavaScript");
          }

          console.log(
            `Artefato validado para ${base}: ${scripts.length} entrada(s), ` +
            `${files.length} arquivo(s) em assets.`,
          );
          NODE

      - name: Instalar Chromium para testar o artefato
        run: pnpm exec playwright install --with-deps chromium

      - name: Testar o artefato final em desktop e celular
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: pnpm test:e2e:artifact

      - name: Testar instalacao, atualizacao e suporte offline da PWA
        run: pnpm test:e2e:pwa

      - name: Armazenar dist validado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: academia-iat-${{ github.sha }}
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 0

      - name: Preservar SBOM do commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-academia-iat-${{ github.sha }}
          path: sbom-academia-iat.cdx.json
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Publicar exatamente o artefato aprovado
    needs: build-and-test
    if: >-
      success() &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Baixar o artefato aprovado neste mesmo run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: academia-iat-${{ github.sha }}
          path: dist

      - name: Confirmar identidade e integridade do artefato
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -f dist/.nojekyll
          grep -R --include='*.js' --fixed-strings "$APPROVED_SHA" dist/assets >/dev/null

      - name: Publicar a branch gh-pages sem recompilar
        env:
          APPROVED_SHA: ${{ github.sha }}
          APPROVED_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -- \
            .nojekyll \
            index.html \
            manifest.webmanifest \
            sw.js \
            icone-192.png \
            icone-512.png \
            assets \
            fonts \
            hidro \
            media \
            source-assets
          git commit -m "Deploy ${APPROVED_SHA} aprovado no run ${APPROVED_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

