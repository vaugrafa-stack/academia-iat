<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Sequência técnica de enquadramento</title>
  <desc id="desc">Animação educativa silenciosa que apresenta a sequência de enquadramento prevista no POP: potência e área, critério mais restritivo, IDA, supressão, Consulta Prévia, sensibilidade, estudo e impedimentos ao rito simplificado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071f1d"/><stop offset="1" stop-color="#073345"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65d5c8"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#f4fbf8}.eyebrow{font-size:16px;font-weight:750;letter-spacing:2.5px;fill:#84e4d8}.title{font-size:42px;font-weight:750}.subtitle{font-size:18px;fill:#b8d7d4}.box{fill:#0d3b38;stroke:#397c72;stroke-width:2}.decision{fill:#113e4d;stroke:#3aa9d8;stroke-width:2}.output{fill:#174c40;stroke:#63d2c5;stroke-width:2.5}.label{font-size:13px;font-weight:800;letter-spacing:1.5px;fill:#83e4d7}.node-title{font-size:20px;font-weight:750}.node-copy{font-size:14px;fill:#bcd8d5}.arrow{fill:none;stroke:#65d5c8;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow);stroke-dasharray:9 10;animation:stream 2s linear infinite}.node{opacity:.72;transform-box:fill-box;transform-origin:center;animation:focus 20s ease-in-out infinite}.n1{animation-delay:0s}.n2{animation-delay:2.85s}.n3{animation-delay:5.7s}.n4{animation-delay:8.55s}.n5{animation-delay:11.4s}.n6{animation-delay:14.25s}.n7{animation-delay:17.1s}.note{font-size:14px;fill:#a9c8c5}@keyframes focus{0%,11%{opacity:1;transform:scale(1.025);filter:url(#glow)}17%,100%{opacity:.72;transform:scale(1);filter:none}}@keyframes stream{to{stroke-dashoffset:-38}}@media(prefers-reduced-motion:reduce){.node,.arrow{animation:none!important}.node{opacity:1}}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="1180" cy="650" r="270" fill="#1f8a5b" opacity=".08"/><circle cx="80" cy="65" r="180" fill="#1e7fae" opacity=".09"/>
  <g transform="translate(70 55)"><rect width="238" height="34" rx="17" fill="#164c43" stroke="#3f8d7f"/><text class="eyebrow" x="18" y="23">MICROAULA • 20 S</text></g>
  <text class="title" x="70" y="137">Enquadramento: siga a sequência</text>
  <text class="subtitle" x="70" y="172">Modalidade adequada e suficiência documental são avaliações distintas.</text>

  <path class="arrow" d="M330 270H400"/><path class="arrow" d="M650 270H720"/><path class="arrow" d="M970 270H1020V346H940"/>
  <path class="arrow" d="M720 438H650"/><path class="arrow" d="M400 438H330"/><path class="arrow" d="M330 515C520 620 820 620 1010 586"/>

  <g class="node n1"><rect class="box" x="70" y="210" width="260" height="120" rx="18"/><circle cx="102" cy="242" r="17" fill="#1f8a5b"/><text x="102" y="248" text-anchor="middle" font-size="17" font-weight="800">1</text><text class="label" x="128" y="247">MEDIR</text><text class="node-title" x="94" y="282">Potência e área</text><text class="node-copy" x="94" y="307">de alagamento</text></g>
  <g class="node n2"><rect class="decision" x="400" y="210" width="250" height="120" rx="18"/><circle cx="432" cy="242" r="17" fill="#1e7fae"/><text x="432" y="248" text-anchor="middle" font-size="17" font-weight="800">2</text><text class="label" x="458" y="247">COMPARAR</text><text class="node-title" x="424" y="282">Adotar o critério</text><text class="node-copy" x="424" y="307">mais restritivo</text></g>
  <g class="node n3"><rect class="box" x="720" y="210" width="250" height="120" rx="18"/><circle cx="752" cy="242" r="17" fill="#1f8a5b"/><text x="752" y="248" text-anchor="middle" font-size="17" font-weight="800">3</text><text class="label" x="778" y="247">CALCULAR</text><text class="node-title" x="744" y="286">IDA</text><text class="node-copy" x="744" y="309">Índice aplicável</text></g>
  <g class="node n4"><rect class="box" x="940" y="378" width="270" height="120" rx="18"/><circle cx="972" cy="410" r="17" fill="#1f8a5b"/><text x="972" y="416" text-anchor="middle" font-size="17" font-weight="800">4</text><text class="label" x="998" y="415">VERIFICAR</text><text class="node-title" x="964" y="450">Supressão de</text><text class="node-copy" x="964" y="475">vegetação nativa</text></g>
  <g class="node n5"><rect class="box" x="720" y="378" width="220" height="120" rx="18"/><circle cx="752" cy="410" r="17" fill="#1e7fae"/><text x="752" y="416" text-anchor="middle" font-size="17" font-weight="800">5</text><text class="label" x="778" y="415">CHECAR</text><text class="node-title" x="744" y="450">Consulta Prévia</text><text class="node-copy" x="744" y="475">quando aplicável</text></g>
  <g class="node n6"><rect class="box" x="400" y="378" width="250" height="120" rx="18"/><circle cx="432" cy="410" r="17" fill="#1e7fae"/><text x="432" y="416" text-anchor="middle" font-size="17" font-weight="800">6</text><text class="label" x="458" y="415">AVALIAR</text><text class="node-title" x="424" y="450">Sensibilidade e</text><text class="node-copy" x="424" y="475">estudo exigível</text></g>
  <g class="node n7"><rect class="decision" x="70" y="378" width="260" height="150" rx="18"/><circle cx="102" cy="410" r="17" fill="#1e7fae"/><text x="102" y="416" text-anchor="middle" font-size="17" font-weight="800">7</text><text class="label" x="128" y="415">CONFIRMAR</text><text class="node-title" x="94" y="450">Há fato que afasta</text><text class="node-title" x="94" y="476">o simplificado?</text><text class="node-copy" x="94" y="507">Motivar a conclusão</text></g>

  <g class="node n7"><rect class="output" x="1010" y="545" width="200" height="82" rx="20"/><text class="label" x="1035" y="575">RESULTADO</text><text x="1035" y="606" font-size="20" font-weight="750">Modalidade + estudo</text></g>
  <text class="note" x="70" y="681">Fonte didática: POP-DLE-HID-001 v1.2 • Seção 8 • A matriz não substitui a leitura da norma e dos TRs vigentes.</text>
</svg>
