<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo didático do PACUERA</title>
  <desc id="desc">Animação educativa silenciosa sobre elaboração e protocolo, análise do IAT, participação social, conclusão técnica, decisão e implementação do PACUERA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061f1c"/><stop offset="1" stop-color="#07364a"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1e7fae"/><stop offset=".55" stop-color="#3aa9d8"/><stop offset="1" stop-color="#63d2c5"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63d2c5"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#f4fbf8}.eyebrow{font-size:16px;font-weight:750;letter-spacing:2.5px;fill:#84e4d8}.title{font-size:42px;font-weight:750}.subtitle{font-size:18px;fill:#b8d7d4}.box{fill:#0d3b38;stroke:#397c72;stroke-width:2}.social{fill:#103b4a;stroke:#3aa9d8;stroke-width:2}.decision{fill:#174c40;stroke:#63d2c5;stroke-width:2}.label{font-size:12px;font-weight:800;letter-spacing:1.4px;fill:#83e4d7}.node-title{font-size:19px;font-weight:750}.node-copy{font-size:13.5px;fill:#bdd8d5}.arrow{fill:none;stroke:#63d2c5;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow);stroke-dasharray:9 10;animation:stream 2.2s linear infinite}.node{opacity:.72;transform-box:fill-box;transform-origin:center;animation:focus 20s ease-in-out infinite}.n1{animation-delay:0s}.n2{animation-delay:3.3s}.n3{animation-delay:6.6s}.n4{animation-delay:9.9s}.n5{animation-delay:13.2s}.n6{animation-delay:16.5s}.branch{animation:branch 20s ease-in-out infinite 4.2s}.note{font-size:13.5px;fill:#a9c8c5}@keyframes focus{0%,13%{opacity:1;transform:translateY(-7px);filter:url(#glow)}19%,100%{opacity:.72;transform:translateY(0);filter:none}}@keyframes stream{to{stroke-dashoffset:-38}}@keyframes branch{0%,16%{opacity:1}25%,100%{opacity:.63}}@media(prefers-reduced-motion:reduce){.node,.arrow,.branch{animation:none!important}.node,.branch{opacity:1}}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="1170" cy="80" r="230" fill="#1f8a5b" opacity=".08"/><circle cx="40" cy="620" r="245" fill="#1e7fae" opacity=".08"/>
  <g transform="translate(70 52)"><rect width="238" height="34" rx="17" fill="#164c43" stroke="#3f8d7f"/><text class="eyebrow" x="18" y="23">MICROAULA • 20 S</text></g>
  <text class="title" x="70" y="133">PACUERA: do plano à implementação</text>
  <text class="subtitle" x="70" y="168">Gestão territorial e conservação ambiental do entorno de reservatórios artificiais.</text>

  <path class="arrow" d="M252 330H275"/><path class="arrow" d="M457 330H480"/><path class="arrow" d="M662 330H685"/><path class="arrow" d="M867 330H890"/><path class="arrow" d="M1072 330H1095"/>
  <g class="node n1"><rect class="box" x="70" y="250" width="182" height="160" rx="19"/><circle cx="102" cy="282" r="17" fill="#1f8a5b"/><text x="102" y="288" text-anchor="middle" font-size="17" font-weight="800">1</text><text class="label" x="126" y="287">ELABORAR</text><text class="node-title" x="92" y="324">Protocolar com</text><text class="node-title" x="92" y="348">PBA ou RDPA</text><text class="node-copy" x="92" y="379">Conforme licença</text><text class="node-copy" x="92" y="397">e estudo aplicáveis</text></g>
  <g class="node n2"><rect class="box" x="275" y="250" width="182" height="160" rx="19"/><circle cx="307" cy="282" r="17" fill="#1e7fae"/><text x="307" y="288" text-anchor="middle" font-size="17" font-weight="800">2</text><text class="label" x="331" y="287">ANALISAR</text><text class="node-title" x="297" y="324">Conformidade e</text><text class="node-title" x="297" y="348">mérito ambiental</text><text class="node-copy" x="297" y="379">Conteúdo mínimo,</text><text class="node-copy" x="297" y="397">diagnóstico e zonas</text></g>
  <g class="node n3"><rect class="social" x="480" y="250" width="182" height="160" rx="19"/><circle cx="512" cy="282" r="17" fill="#1e7fae"/><text x="512" y="288" text-anchor="middle" font-size="17" font-weight="800">3</text><text class="label" x="536" y="287">PARTICIPAR</text><text class="node-title" x="502" y="324">Consulta ou</text><text class="node-title" x="502" y="348">audiência pública</text><text class="node-copy" x="502" y="379">Instrumento definido</text><text class="node-copy" x="502" y="397">conforme tipologia</text></g>
  <g class="node n4"><rect class="box" x="685" y="250" width="182" height="160" rx="19"/><circle cx="717" cy="282" r="17" fill="#1f8a5b"/><text x="717" y="288" text-anchor="middle" font-size="17" font-weight="800">4</text><text class="label" x="741" y="287">CONCLUIR</text><text class="node-title" x="707" y="324">Classificar cada</text><text class="node-title" x="707" y="348">dimensão técnica</text><text class="node-copy" x="707" y="379">Suficiência, zonas,</text><text class="node-copy" x="707" y="397">cartografia e execução</text></g>
  <g class="node n5"><rect class="decision" x="890" y="250" width="182" height="160" rx="19"/><circle cx="922" cy="282" r="17" fill="#1f8a5b"/><text x="922" y="288" text-anchor="middle" font-size="17" font-weight="800">5</text><text class="label" x="946" y="287">DECIDIR</text><text class="node-title" x="912" y="324">Autoridade</text><text class="node-title" x="912" y="348">competente do IAT</text><text class="node-copy" x="912" y="379">Aprovar, não aprovar</text><text class="node-copy" x="912" y="397">ou arquivar</text></g>
  <g class="node n6"><rect class="box" x="1095" y="250" width="150" height="160" rx="19"/><circle cx="1127" cy="282" r="17" fill="#1e7fae"/><text x="1127" y="288" text-anchor="middle" font-size="17" font-weight="800">6</text><text class="label" x="1151" y="287">GERIR</text><text class="node-title" x="1117" y="324">Implementar</text><text class="node-title" x="1117" y="348">e monitorar</text><text class="node-copy" x="1117" y="379">Revisão obrigatória</text><text class="node-copy" x="1117" y="397">a cada 10 anos</text></g>

  <g class="branch" opacity=".68">
    <path d="M366 410V446" stroke="#f2c66d" stroke-width="3" stroke-dasharray="7 7"/>
    <rect x="245" y="446" width="395" height="94" rx="17" fill="#493e20" stroke="#f2c66d" stroke-width="1.5"/>
    <text x="268" y="474" font-size="13" font-weight="800" letter-spacing="1.2" fill="#f6d98f">SE HOUVER COMPLEMENTAÇÃO FORMAL</text>
    <text x="268" y="502" font-size="16" font-weight="700">1 reapresentação • 120 dias corridos</text>
    <text class="node-copy" x="268" y="526">Análise suspensa durante o atendimento</text>
  </g>
  <g opacity=".92">
    <rect x="685" y="446" width="560" height="94" rx="17" fill="#0b2d35" stroke="#316a78"/>
    <text class="label" x="708" y="473">PARTICIPAÇÃO SOCIAL NO TR CONSULTADO</text>
    <text x="708" y="501" font-size="15" font-weight="650">MGH/CGH: consulta*  •  PCH: consulta ou audiência  •  UHE: audiência obrigatória</text>
    <text class="node-copy" x="708" y="526">* salvo necessidade técnica fundamentada de audiência pública</text>
  </g>

  <path d="M55 620 C220 560 330 680 500 618 S790 560 965 620 S1160 676 1270 605" fill="none" stroke="url(#water)" stroke-width="7" opacity=".7"/>
  <path d="M25 645 C200 585 320 700 505 642 S810 590 985 644 S1160 690 1290 635" fill="none" stroke="#3aa9d8" stroke-width="2" opacity=".45"/>
  <text class="note" x="70" y="687">Fonte didática: POP-DLE-HID-001 v1.2 • Seção 18.10 • Confirmar o TR PACUERA vigente na data do protocolo.</text>
</svg>
